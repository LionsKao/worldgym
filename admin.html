<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Ctext x='22' y='19' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='16' fill='%23e8604c'%3E課表%3C/text%3E%3Ctext x='22' y='38' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='16' fill='%233a3a4a'%3E管理%3C/text%3E%3C/svg%3E">
<title>⚡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* cdnjs 的 Font Awesome all.min.css 把圖示字型設成 font-display:block（載入完成前圖示直接不顯示）。
   瀏覽器對重複 @font-face 是「先宣告的贏」，所以這段要排在下面 Font Awesome <link> 之前，
   才能用同樣的 family/weight/style/src 把 font-display 換成 swap。
   只覆寫實際會用到的 fa-solid 跟 fa-brands，不動 regular（沒在用）。*/
@font-face{
  font-family:"Font Awesome 6 Free"; font-style:normal; font-weight:900; font-display:swap;
  src:url(https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-solid-900.woff2) format("woff2");
}
@font-face{
  font-family:"Font Awesome 6 Brands"; font-style:normal; font-weight:400; font-display:swap;
  src:url(https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-brands-400.woff2) format("woff2");
}
</style>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous"></noscript>
<link rel="stylesheet" href="style.css?v=71">
<style>
  .admin-link-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
  .admin-link-btn{
    display:inline-flex; align-items:center; box-sizing:border-box; gap:6px;
    height:31px; padding:0 16px; border:1.5px solid var(--link-color); border-radius:999px;
    text-decoration:none; background:var(--link-color); color:#fff;
    font-weight:700; font-size:12.5px; white-space:nowrap;
    transition:background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  .admin-link-btn i{ font-size:13px; }
  .pill-btn-solid{
    gap:6px; background:var(--accent); border-color:var(--accent); color:#fff;
  }
  .pill-btn-solid:hover{ background:var(--accent); border-color:var(--accent); color:#fff; opacity:.85; }

  .page{ max-width:1100px; }
  .admin-layout{ display:grid; grid-template-columns:1fr; gap:20px; align-items:start; }
  .admin-col{ margin-bottom:0; min-width:0; }
  .admin-layout .admin-col:last-child{ margin-bottom:15px; }
  .terminal-panel{ display:flex; flex-direction:column; gap:14px; }
  .terminal-log{
    background:#1e1e2e; color:#d8dee9;
    font-family:"SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size:12.5px; line-height:1.7; padding:14px 16px; border-radius:12px;
    height:210px; max-height:210px; overflow-y:auto; overflow-x:hidden; white-space:pre-wrap; word-break:break-word;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .terminal-log::-webkit-scrollbar{ display:none; width:0; height:0; }
  .terminal-log .term-line + .term-line{ margin-top:1px; }
  .terminal-log .term-time{ color:#6c7a96; margin-right:6px; }
  .terminal-log .term-ok{ color:var(--teal); }
  .terminal-log .term-err{ color:var(--coral); }
  .terminal-log .term-empty{ color:#6c7a96; }
  .login-box{ max-width:280px; }
  .login-input{
    width:100%; box-sizing:border-box; font-size:12.5px; padding:10px 16px;
    border:1.5px solid var(--line); border-radius:999px; background:var(--paper);
    font-family:inherit; font-weight:600; text-align:center;
  }
  #adminLoginBtnWrap{ display:block; width:100%; }
  #adminLoginBackBtnWrap{ z-index:1500; }

  .ad-stats-filter-row{ display:flex; gap:8px; margin-bottom:14px; }
  .ad-stats-filter-row #adStatusFilter{ flex:0 0 100px; min-width:100px; }
  .ad-stats-filter-row #adStatsSelect{ flex:1 1 0; min-width:0; }

  #adStatsDetail{ font-size:12.5px; line-height:1.7; color:var(--sub); }

  .favorite-stats-summary{ display:flex; gap:24px; margin-bottom:12px; }
  .favorite-stats-item{ flex:1; }
  .favorite-stats-num{ font-size:22px; font-weight:800; color:var(--ink); line-height:1.3; }
  .favorite-stats-label{ font-size:11.5px; color:var(--sub); }

  .ad-chart-wrap{ display:flex; align-items:center; gap:6px; margin-top:12px; }
  .ad-chart-nav{
    flex:none; width:28px; height:28px; border-radius:50%; box-sizing:border-box;
    border:1.5px solid var(--navy); background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px;
    cursor:pointer; transition:opacity .15s ease, background-color .15s ease;
  }
  .ad-chart-nav:hover:not(:disabled){ background:#4a4a5a; border-color:#4a4a5a; }
  .ad-chart-nav:disabled{ opacity:.3; cursor:not-allowed; }
  .ad-chart-viewport{ position:relative; flex:1; min-width:0; aspect-ratio:560/210; overflow:hidden; }

  /* 觸發按鈕跟著目前選到的文字（「7 天」）縮到最窄，選單寬度預設又跟觸發按鈕一樣寬，
     導致「14 天」「30 天」被裁成「14 ...」。選單固定拉寬、貼右對齊，不受觸發按鈕寬度限制。 */
  #accessLogDaysFilter.open .custom-select-menu{
    left:auto; right:0; width:max(100%, 90px);
  }
</style>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8513ca23d1fc42f2af05b18ff29c709d"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>

<div id="ptrIndicator" class="ptr-indicator"><i class="fa-solid fa-arrow-rotate-right"></i></div>

<div id="adminLoginOverlay" class="modal-overlay">
  <div class="modal-box login-box">
    <p class="modal-text">君たちがここへ来るのは… <br>まだ早すぎるよ <i class="fa-solid fa-heart"></i></p>
    <span class="tooltip-wrap" id="adminLoginBtnWrap">
      <span class="hint-tooltip" id="adminLoginError">密碼錯誤</span>
      <input type="password" id="adminPasswordInput" class="login-input" placeholder="通關密碼" autocomplete="current-password">
    </span>
    <button type="button" class="modal-btn modal-btn-confirm hidden" id="adminLoginBtn">登入</button>
  </div>
</div>

<div class="submit-btn-wrap" id="adminLoginBackBtnWrap">
  <a class="submit-btn" id="adminLoginBackBtn" href="index.html" aria-label="返回課表查詢"><i class="fa-solid fa-arrow-left"></i></a>
</div>

<div class="page hidden" id="adminPage">
  <div class="hero">
    <h1><span class="c1">課表</span><span class="c2">管理</span></h1>
  </div>
  <div class="stripe-bar">
    <span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span><span class="s5"></span>
  </div>

  <div class="admin-layout">
    <div class="sheet admin-col terminal-panel">
      <div class="field-block" style="--accent:var(--teal)">
        <div class="admin-link-row" style="margin-top:0">
          <a class="admin-link-btn" data-log-text="🔗 已開啟 Cloudflare 資料庫" style="--link-color:var(--teal)" href="https://dash.cloudflare.com/3f6a1c826e260aabaab215af1f8e798a/workers/d1/databases/ca30eeae-ed11-4952-a2e1-c8c251dada71/metrics" target="_blank" rel="noopener"><i class="fa-solid fa-fw fa-database"></i>資料庫</a>
          <a class="admin-link-btn" data-log-text="🔗 已開啟 Google Analytics" style="--link-color:#4285f4" href="https://analytics.google.com/analytics/web/?hl=zh-tw#/a404061385p549256263/reports/intelligenthome" target="_blank" rel="noopener"><i class="fa-solid fa-fw fa-chart-line"></i>GA4</a>
          <a class="admin-link-btn" data-log-text="🔗 已開啟 Cloudflare Web Analytics" style="--link-color:#f38020" href="https://dash.cloudflare.com/3f6a1c826e260aabaab215af1f8e798a/web-analytics/overview?siteTag~in=663f9502426d4a61855ee0a0af379fc9&excludeBots=Yes" target="_blank" rel="noopener"><i class="fa-solid fa-fw fa-gauge-high"></i>Cloudflare 分析</a>
          <button type="button" class="pill-btn pill-btn-solid" id="cleanupStaleBtn" style="--accent:var(--coral)"><i class="fa-solid fa-fw fa-trash-can"></i>刪除停用分店資料</button>
          <button type="button" class="pill-btn pill-btn-solid" id="rescrapeAllCf" style="--accent:#f5820d"><i class="fa-solid fa-fw fa-cloud"></i>重抓所有分店</button>
        </div>
      </div>
      <div class="terminal-log" id="terminalLog"><span class="term-empty">👋 已成功登入</span><br><span class="term-empty">🤖 等待命令執行</span></div>
    </div>

    <div class="sheet admin-col">
      <div class="field-block" style="--accent:var(--navy)">
        <div class="section-head">
          <span class="section-tag"><i class="fa-solid fa-fw fa-chart-simple"></i>廣告</span>
        </div>
        <div class="ad-stats-filter-row">
          <div id="adStatusFilter" class="custom-select" data-value="all">
            <button type="button" class="custom-select-trigger">
              <span class="custom-select-label">全部</span>
              <i class="fa-solid fa-chevron-down custom-select-arrow"></i>
            </button>
            <div class="custom-select-menu">
              <div class="custom-select-option" data-value="active">上架中</div>
              <div class="custom-select-option" data-value="inactive">已下架</div>
              <div class="custom-select-option selected" data-value="all">全部</div>
            </div>
          </div>
          <div id="adStatsSelect" class="custom-select" data-value="">
            <button type="button" class="custom-select-trigger">
              <span class="custom-select-label"></span>
              <i class="fa-solid fa-chevron-down custom-select-arrow"></i>
            </button>
            <div class="custom-select-menu"></div>
          </div>
        </div>
        <div id="adStatsDetail"></div>
        <div class="ad-chart-wrap">
          <button type="button" class="ad-chart-nav" id="adChartPrevBtn" aria-label="更早月份"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="ad-chart-viewport" id="adChartViewport"></div>
          <button type="button" class="ad-chart-nav" id="adChartNextBtn" aria-label="更晚月份"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="stats-chart-legend">
          <span class="stats-chart-legend-item"><span class="stats-chart-legend-swatch" style="background:#2a78d6"></span>曝光次數</span>
          <span class="stats-chart-legend-item"><span class="stats-chart-legend-swatch" style="background:#eb6834"></span>點擊次數</span>
        </div>
      </div>
    </div>

    <div class="sheet admin-col">
      <div class="field-block" style="--accent:var(--coral)">
        <div class="section-head">
          <span class="section-tag"><i class="fa-solid fa-fw fa-heart"></i>最愛</span>
        </div>
        <div id="favoriteStatsSummary" class="favorite-stats-summary"></div>
        <div id="favoriteTrendWrap"></div>
        <div class="stats-chart-legend">
          <span class="stats-chart-legend-item"><span class="stats-chart-legend-swatch" style="background:#2a78d6"></span>建立人數</span>
          <span class="stats-chart-legend-item"><span class="stats-chart-legend-swatch" style="background:#eb6834"></span>使用次數</span>
        </div>
      </div>
    </div>

    <div class="sheet admin-col">
      <div class="field-block" style="--accent:var(--teal)">
        <div class="section-head">
          <span class="section-tag"><i class="fa-solid fa-fw fa-bell"></i>提醒</span>
        </div>
        <div id="reminderStatsSummary" class="favorite-stats-summary"></div>
        <div id="reminderTrendWrap"></div>
        <div class="stats-chart-legend">
          <span class="stats-chart-legend-item"><span class="stats-chart-legend-swatch" style="background:#3fae8f"></span>登記次數</span>
        </div>
      </div>
    </div>

    <div class="sheet admin-col">
      <div class="field-block" style="--accent:var(--orange)">
        <div class="section-head">
          <span class="section-tag"><i class="fa-solid fa-fw fa-shield-halved"></i>存取紀錄</span>
          <div id="accessLogDaysFilter" class="custom-select" data-value="7">
            <button type="button" class="custom-select-trigger">
              <span class="custom-select-label">7 天</span>
              <i class="fa-solid fa-chevron-down custom-select-arrow"></i>
            </button>
            <div class="custom-select-menu">
              <div class="custom-select-option selected" data-value="7">7 天</div>
              <div class="custom-select-option" data-value="14">14 天</div>
              <div class="custom-select-option" data-value="30">30 天</div>
            </div>
          </div>
        </div>
        <div id="accessLogTableWrap" class="access-log-table-wrap"></div>
      </div>
    </div>
  </div>
</div>

<div class="submit-btn-wrap hidden" id="adminBackBtnWrap">
  <span class="tooltip-wrap">
    <span class="hint-tooltip" id="adminBackTooltip">登出</span>
    <button type="button" class="submit-btn" id="adminBackBtn" aria-label="返回並登出"><i class="fa-solid fa-arrow-left"></i></button>
  </span>
</div>

<div id="rescrapeModal" class="modal-overlay hidden">
  <div class="modal-box">
    <button type="button" class="modal-close-btn" id="rescrapeCloseBtn" aria-label="取消"><i class="fa-solid fa-xmark"></i></button>
    <p class="modal-text" id="rescrapeModalText">確定要重抓嗎？</p>
    <div class="modal-actions">
      <button type="button" class="modal-btn" id="rescrapeCancelBtn">取消</button>
      <button type="button" class="modal-btn modal-btn-confirm" id="rescrapeConfirmBtn">確定</button>
    </div>
  </div>
</div>

<script src="vendor/chart.umd.min.js"></script>
<script src="admin.js?v=37"></script>
</body>
</html>
