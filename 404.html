<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Ctext x='22' y='19' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='16' fill='%23e8604c'%3E課表%3C/text%3E%3Ctext x='22' y='38' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='16' fill='%233a3a4a'%3E查詢%3C/text%3E%3C/svg%3E">
<title>❓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=44">
<style>
  .notfound-code{ font-size:48px; font-weight:900; color:var(--coral); margin:0 0 6px; letter-spacing:1px; }
  .notfound-desc{ font-size:12.5px; color:var(--sub); line-height:1.7; margin:0 0 24px; }
  .notfound-home-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    height:44px; padding:0 28px; border-radius:999px; text-decoration:none;
    background:var(--coral); color:#fff; font-weight:800; font-size:14px;
    box-shadow:0 6px 16px rgba(232,96,76,0.35);
  }
  .notfound-home-btn:hover{ background:#d8543f; }
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <h1><span class="c1">課表</span><span class="c2">查詢</span></h1>
  </div>
  <div class="stripe-bar">
    <span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span><span class="s5"></span>
  </div>

  <div class="sheet" style="text-align:center;">
    <p class="notfound-code">404</p>
    <p class="notfound-desc">找不到這個頁面，可能已經被移動或網址打錯了。<br>回首頁重新查詢課表吧。</p>
    <a class="notfound-home-btn" href="/"><i class="fa-solid fa-house"></i>回首頁</a>
  </div>
</div>

</body>
</html>
