name = "worldgym-api"
main = "src/index.js"
compatibility_date = "2026-08-11"
# @block65/webcrypto-web-push 內部匯入 node:crypto,沒開這個 flag 在 runtime 會出錯。
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "worldgym-schedule"
database_id = "ca30eeae-ed11-4952-a2e1-c8c251dada71"

# 不再用 Firebase Function 排程爬蟲。目前沒有自動每日爬蟲機制，只能靠 admin.html
# 手動重抓（Cloudflare Worker 自己打官網，過去測試會被官網擋 HTTP 530，實際狀況要重新測）。
# 爬蟲本身仍然維持手動觸發，不掛在下面這個 cron 上——下面的 cron 只用來每 5 分鐘掃描
# 課表通知（reminders）有沒有到期，見 src/index.js 的 scheduled()。

[triggers]
crons = ["*/5 * * * *"]

