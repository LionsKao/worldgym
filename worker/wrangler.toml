name = "worldgym-api"
main = "src/index.js"
compatibility_date = "2026-08-11"
# @block65/webcrypto-web-push 內部匯入 node:crypto,沒開這個 flag 在 runtime 會出錯。
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "worldgym-schedule"
database_id = "ca30eeae-ed11-4952-a2e1-c8c251dada71"

# /queryClasses 的流量限制用（IP + 60 秒窗口的請求次數計數），跟 D1 分開，純粹防濫用不做精確計費。
[[kv_namespaces]]
binding = "QUERY_RATE_LIMIT"
id = "27ad85dc0a2f411fbe0bd4f31451fad3"

# 爬蟲一輪要對每間分店（目前 111 間）各發一個 subrequest，超過 Workers 免費方案「每次執行 50 個 subrequest」的上限，
# 需要 Workers Paid（「每次執行」上限 1000）才跑得完；不是官網擋 Worker。
# "*/5 * * * *" 每 5 分鐘掃描課表通知（reminders）有沒有到期；
# "0 19 * * *" / "0 9 * * *" 是每天台灣時間 03:00 / 17:00（UTC+8，換算 UTC 19:00 / 09:00）
# 各自動重抓一次全部分店；
# "0 20 1 * *" 是每月 1 號台灣時間 04:00（UTC 20:00）：清一次 query_access_log 90 天前的舊紀錄，
# 並把分析報表明細表超過保留窗口的舊月份壓縮成彙總、刪除明細（見 src/analytics.js）；
# "0 21 2 * *" 是每月 2 號台灣時間 05:00（UTC 21:00）：跟官網 sitemap 比對分店清單有沒有新增/疑似下架（見 src/branchScan.js）。
# 見 src/index.js 的 scheduled()。

[triggers]
crons = ["*/5 * * * *", "0 19 * * *", "0 9 * * *", "0 20 1 * *", "0 21 2 * *"]

